  </defs>
  <style>
    .beam-sweep {
      animation: beamMove 5.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .live-ring {
      transform-origin: 84px 32px;
      animation: pulseRing 2.4s ease-out infinite;
    }
    @keyframes beamMove {
      0% { transform: translateX(-280px); opacity: 0.2; }
      40% { opacity: 1; }
      100% { transform: translateX(920px); opacity: 0.2; }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.9); opacity: 0.85; }
      70% { transform: scale(2.1); opacity: 0; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .beam-sweep, .live-ring { animation: none !important; transition: none !important; } }
  </style>

