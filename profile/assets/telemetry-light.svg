<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 64" width="880" height="64" fill="none" role="img" aria-labelledby="telemetry-title telemetry-desc">
  <title id="telemetry-title">Teralis Tech — Telemetria TERA AI em Tempo Real</title>
  <desc id="telemetry-desc">TERA AI · ONLINE 24/7 | &lt; 3s RESPOSTA · 99.98% SLA · TERALIS.PRO</desc>
  <defs>
    <linearGradient id="beam-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E52E3D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E52E3D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="strip-clip-light">
      <rect x="0.5" y="0.5" width="879" height="63" rx="12"/>
